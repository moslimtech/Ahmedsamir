<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Markerless AR — Vertical Poster + Soft Shadow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>
    body { margin:0; overflow:hidden; font-family:system-ui, sans-serif }
    #overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.6); color:#fff; z-index: 5; flex-direction: column; gap: 12px;
    }
    #startBtn { 
      padding: 12px 24px; font-size: 18px; border-radius: 8px; border: 0; 
      background: #00bcd4; color:#fff; cursor: pointer; font-weight: bold;
    }
    #startBtn:active { background: #0097a7; }
    #msg { font-size: 14px; opacity: 0.9; text-align: center; max-width: 90%; padding: 0 15px }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="msg">اضغط لبدء الواقع المعزّز. حرّك الهاتف ببطء للكشف عن الأسطح.</div>
    <button id="startBtn">ابدأ AR</button>
  </div>

  <!-- استخدام المكوّن المدمج ar-hit-test من A-Frame -->
  <a-scene
    embedded
    renderer="alpha:true; colorManagement:true; physicallyCorrectLights:true"
    vr-mode-ui="enabled:false"
    webxr="optionalFeatures: hit-test, dom-overlay; overlayElement: #overlay"
    ar-hit-test="target:#holo; enabled:true"
  >
    <a-assets timeout="15000">
      <img id="logoTex" src="logo.png" crossorigin="anonymous" />
      <img id="shadowTex" crossorigin="anonymous"
           src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><defs><radialGradient id='g' cx='50%25' cy='50%25' r='50%25'><stop offset='0%25' stop-color='black' stop-opacity='0.45'/><stop offset='60%25' stop-color='black' stop-opacity='0.12'/><stop offset='100%25' stop-color='black' stop-opacity='0'/></radialGradient></defs><rect width='100%25' height='100%25' fill='url(%23g)'/></svg>" />
    </a-assets>

    <!-- الهولوجرام العمودي مع الظل (سيتم وضعه تلقائياً بواسطة ar-hit-test) -->
    <a-entity id="holo" visible="false">
      <!-- ظل ناعم على الأرض -->
      <a-plane id="shadow" position="0 0.001 0" rotation="-90 0 0" width="0.50" height="0.30"
               material="src:#shadowTex; transparent:true; opacity:1; blending:multiply; shader:flat">
      </a-plane>

      <!-- اللوحة العمودية -->
      <a-entity id="panel" position="0 0.26 0">
        <!-- توهج خفيف -->
        <a-plane width="0.35" height="0.50" position="0 0 0" scale="1.05 1.05 1"
                 material="color:#00eaff; opacity:0.14; transparent:true; blending:additive; shader:flat">
          <a-animation attribute="material.opacity" from="0.10" to="0.22" dur="1400" direction="alternate" repeat="indefinite"></a-animation>
        </a-plane>

        <!-- الصورة الأصلية -->
        <a-plane width="0.35" height="0.50" position="0 0.003 0"
                 material="src:#logoTex; shader:flat; transparent:true; alphaTest:0.01">
        </a-plane>

        <!-- خط المسح -->
        <a-plane position="0 -0.245 0.006" width="0.35" height="0.03"
                 material="color:#00eaff; transparent:true; opacity:0.18; blending:additive">
          <a-animation attribute="position" from="0 -0.245 0.006" to="0 0.245 0.006" dur="1800" repeat="indefinite" easing="linear"></a-animation>
          <a-animation attribute="material.opacity" from="0.12" to="0.28" dur="900" direction="alternate" repeat="indefinite"></a-animation>
        </a-plane>
      </a-entity>
    </a-entity>

    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.6" position="0.5 1 0.5"></a-entity>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('startBtn');
    const overlay = document.getElementById('overlay');

    // استماع لأحداث ar-hit-test المدمجة
    sceneEl.addEventListener('enter-vr', function () {
      if (this.is('ar-mode')) {
        msg.textContent = 'جارِ المسح...';

        // عند بدء المسح
        this.addEventListener('ar-hit-test-start', function () {
          msg.textContent = 'جارِ الكشف عن الأسطح. حرّك الهاتف ببطء.';
        }, { once: true });

        // عند إيجاد سطح
        this.addEventListener('ar-hit-test-achieved', function () {
          msg.textContent = 'اضغط على الشاشة لوضع الهولوجرام.';
        }, { once: true });

        // عند وضع الكائن
        this.addEventListener('ar-hit-test-select', function () {
          msg.textContent = 'تم! اضغط مرة أخرى لإعادة الوضع.';
          // يمكنك تعطيل ar-hit-test بعد الوضع الأول إذا أردت
          // sceneEl.setAttribute('ar-hit-test', 'enabled', false);
        }, { once: false });
      }
    });

    // زر البدء
    btn.addEventListener('click', async () => {
      try {
        if (!navigator.xr) {
          msg.textContent = '❌ متصفحك لا يدعم WebXR.';
          return;
        }

        const supported = await navigator.xr.isSessionSupported('immersive-ar');
        if (!supported) {
          msg.textContent = '❌ جهازك لا يدعم AR. استخدم Chrome على أندرويد حديث.';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'جارِ البدء...';
        await sceneEl.enterVR();

      } catch (error) {
        console.error('Error:', error);
        btn.disabled = false;
        btn.textContent = 'ابدأ AR';
        
        if (error.name === 'NotAllowedError') {
          msg.textContent = '❌ تم رفض إذن الكاميرا.';
        } else if (error.name === 'SecurityError') {
          msg.textContent = '❌ يجب استخدام HTTPS.';
        } else {
          msg.textContent = `❌ خطأ: ${error.message}`;
        }
      }
    });
  </script>
</body>
</html>
