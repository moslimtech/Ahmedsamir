<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Hologram Logo AR - Cube Stable</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.3.2/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin:0; overflow:hidden; }
    #hint { 
      position:absolute; left:10px; top:10px; z-index:5; 
      background:rgba(0,0,0,0.45); color:white; padding:8px 10px; 
      border-radius:6px; font-size:14px; 
    }
  </style>
</head>
<body>
  <div id="hint">وجّه الكاميرا على ماركر Hiro لعرض الشعار.</div>

  <canvas id="roundedCanvas" width="256" height="384" style="display:none"></canvas>

  <a-scene embedded arjs="debugUIEnabled: false; trackingMethod: best;">
    <a-assets>
      <img id="logoTex" src="" crossorigin="anonymous" />
    </a-assets>

    <a-marker preset="hiro" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
      <a-entity position="0 0 0">
        
        <!-- مجموعة المكعب الدوّار - دوران واحد مستقر -->
        <a-entity id="hologramCube" position="0 0.75 0">
          
          <!-- الوجه 1 - الأمام -->
          <a-plane 
            position="0 0 0.45" 
            rotation="0 0 0" 
            width="0.9" 
            height="0.9"
            material="src: #roundedCanvas; transparent: true; opacity: 0.85; alphaTest: 0.01; side: double"
          ></a-plane>
          
          <!-- الوجه 2 - الخلف -->
          <a-plane 
            position="0 0 -0.45" 
            rotation="0 180 0" 
            width="0.9" 
            height="0.9"
            material="src: #roundedCanvas; transparent: true; opacity: 0.85; alphaTest: 0.01; side: double"
          ></a-plane>
          
          <!-- الوجه 3 - اليمين -->
          <a-plane 
            position="0.45 0 0" 
            rotation="0 90 0" 
            width="0.9" 
            height="0.9"
            material="src: #roundedCanvas; transparent: true; opacity: 0.85; alphaTest: 0.01; side: double"
          ></a-plane>
          
          <!-- الوجه 4 - اليسار -->
          <a-plane 
            position="-0.45 0 0" 
            rotation="0 -90 0" 
            width="0.9" 
            height="0.9"
            material="src: #roundedCanvas; transparent: true; opacity: 0.85; alphaTest: 0.01; side: double"
          ></a-plane>
          
          <!-- الوجه 5 - الأعلى -->
          <a-plane 
            position="0 0.45 0" 
            rotation="-90 0 0" 
            width="0.9" 
            height="0.9"
            material="src: #roundedCanvas; transparent: true; opacity: 0.85; alphaTest: 0.01; side: double"
          ></a-plane>
          
          <!-- الوجه 6 - الأسفل -->
          <a-plane 
            position="0 -0.45 0" 
            rotation="90 0 0" 
            width="0.9" 
            height="0.9"
            material="src: #roundedCanvas; transparent: true; opacity: 0.85; alphaTest: 0.01; side: double"
          ></a-plane>

          <!-- دوران واحد مستقر على محور Y فقط -->
          <a-animation 
            attribute="rotation" 
            from="0 0 0" 
            to="0 360 0" 
            dur="12000" 
            repeat="indefinite"
            easing="linear"
          ></a-animation>
        </a-entity>

        <!-- Scanline محسّن -->
        <a-plane 
          position="0 -0.8 0" 
          width="1.4" 
          height="0.04"
          material="color: #00eaff; transparent: true; opacity: 0.15; blending: additive"
        >
          <a-animation 
            attribute="position" 
            from="0 -0.8 0" 
            to="0 2.2 0" 
            dur="2400" 
            repeat="indefinite" 
            easing="linear"
          ></a-animation>
        </a-plane>

        <!-- الهالة الخارجية -->
        <a-ring 
          position="0 0.01 0" 
          rotation="-90 0 0" 
          radius-inner="0.4" 
          radius-outer="0.75"
          material="color: #00eaff; opacity: 0.18; transparent: true; blending: additive"
        >
          <a-animation 
            attribute="material.opacity" 
            from="0.12" 
            to="0.25" 
            dur="1600" 
            direction="alternate" 
            repeat="indefinite"
          ></a-animation>
        </a-ring>

        <!-- هالة داخلية إضافية -->
        <a-ring 
          position="0 0.02 0" 
          rotation="-90 0 0" 
          radius-inner="0.15" 
          radius-outer="0.35"
          material="color: #ffffff; opacity: 0.25; transparent: true; blending: additive"
        >
          <a-animation 
            attribute="material.opacity" 
            from="0.15" 
            to="0.35" 
            dur="1200" 
            direction="alternate" 
            repeat="indefinite"
          ></a-animation>
        </a-ring>

        <!-- خطوط طاقة دائرية -->
        <a-torus 
          position="0 0.75 0" 
          radius="0.6" 
          radius-tubular="0.01"
          material="color: #00eaff; opacity: 0.3; transparent: true; blending: additive"
        >
          <a-animation 
            attribute="rotation" 
            from="0 0 0" 
            to="0 360 0" 
            dur="5000" 
            repeat="indefinite"
            easing="linear"
          ></a-animation>
        </a-torus>

      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Component لتثبيت الحركة
    AFRAME.registerComponent('smooth-transform', {
      init: function () {
        this.el.object3D.matrixAutoUpdate = true;
      }
    });

    // رسم الصورة بزوايا دائرية
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = 'logo.png';
    img.onload = () => {
      const canvas = document.getElementById('roundedCanvas');
      const ctx = canvas.getContext('2d');
      const r = 24;
      const w = canvas.width;
      const h = canvas.height;

      ctx.clearRect(0, 0, w, h);

      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(w - r, 0);
      ctx.quadraticCurveTo(w, 0, w, r);
      ctx.lineTo(w, h - r);
      ctx.quadraticCurveTo(w, h, w - r, h);
      ctx.lineTo(r, h);
      ctx.quadraticCurveTo(0, h, 0, h - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.clip();

      ctx.drawImage(img, 0, 0, w, h);

      document.getElementById('logoTex').src = canvas.toDataURL();
    };
  </script>
</body>
</html>
