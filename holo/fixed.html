<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AR ذكي - محسّن للكاميرا</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui; }
    
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      padding: 20px;
      text-align: center;
    }
    
    #status {
      font-size: 16px;
      margin: 20px 0;
      max-width: 90%;
    }
    
    .spinner {
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .success { color: #4caf50; font-weight: bold; }
    .error { color: #ff5252; }
    
    #instructions {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-align: center;
      z-index: 9999;
      font-size: 13px;
      display: none;
    }
  </style>
</head>

<body>
  <div id="overlay">
    <div class="spinner"></div>
    <div id="status">جاري تحميل AR.js...</div>
  </div>
  
  <div id="instructions">
    📸 وجّه الكاميرا على ماركر Hiro
  </div>

  <!-- إعدادات محسّنة للكاميرا -->
  <a-scene
    embedded
    arjs="sourceType: webcam;
          sourceWidth: 640;
          sourceHeight: 480;
          displayWidth: 640;
          displayHeight: 480;
          videoTexture: true;
          debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true; precision: medium;">

    <a-assets timeout="10000">
      <img id="logo" src="logo.png" crossorigin="anonymous">
    </a-assets>

    <!-- إضاءة لتحسين الرؤية -->
    <a-light type="ambient" intensity="0.8" color="#FFF"></a-light>
    <a-light type="directional" intensity="0.5" position="1 1 1"></a-light>

    <!-- الماركر -->
    <a-marker preset="hiro" id="marker" smooth="true" smoothCount="3">
      
      <!-- الظل -->
      <a-plane 
        position="0 0.01 0" 
        rotation="-90 0 0" 
        width="1.5" 
        height="1.5" 
        material="color: #222; opacity: 0.5; transparent: true; shader: flat">
      </a-plane>

      <!-- الصورة الرأسية مع التكيف التلقائي -->
      <a-entity 
        id="content"
        position="0 0.8 0"
        distance-scale="reference: 1.5; min: 0.7; max: 2.2; smooth: true"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
        
        <!-- خلفية بيضاء -->
        <a-plane 
          position="0 0 -0.02"
          width="0.9" 
          height="1.2" 
          material="color: #fff; opacity: 0.95"
          rounded-corners>
        </a-plane>

        <!-- الصورة -->
        <a-plane 
          width="0.8" 
          height="1.1" 
          position="0 0 0.01"
          src="#logo"
          material="transparent: true; alphaTest: 0.1"
          rounded-corners>
        </a-plane>

      </a-entity>

    </a-marker>

    <!-- كاميرا بـ FOV أوسع -->
    <a-entity camera="fov: 60"></a-entity>
  </a-scene>

  <script>
    const overlay = document.getElementById('overlay');
    const status = document.getElementById('status');
    const instructions = document.getElementById('instructions');
    
    // ===== تحسين إعدادات الكاميرا =====
    window.addEventListener('arjs-video-loaded', (e) => {
      console.log('✅ Camera loaded!');
      
      // محاولة تحسين إعدادات الفيديو
      const video = document.querySelector('video');
      if (video) {
        // إضافة سطوع وتباين أفضل
        video.style.filter = 'brightness(1.1) contrast(1.05)';
        console.log('Video element found and enhanced');
      }
    });
    
    // ===== التحقق من HTTPS =====
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
      status.innerHTML = '⚠️ <span class="error">يجب فتح الصفحة عبر HTTPS</span>';
      overlay.style.background = 'rgba(200,0,0,0.95)';
    }
    
    window.addEventListener('load', () => {
      status.innerHTML = '📷 جاري طلب إذن الكاميرا...';
    });
    
    const scene = document.querySelector('a-scene');
    
    scene.addEventListener('loaded', () => {
      console.log('✅ A-Frame loaded');
    });
    
    scene.addEventListener('arjs-video-loaded', () => {
      console.log('✅ Camera started!');
      status.innerHTML = '✅ <span class="success">الكاميرا تعمل!</span>';
      setTimeout(() => {
        overlay.style.display = 'none';
        instructions.style.display = 'block';
      }, 1500);
    });
    
    setTimeout(() => {
      if (overlay.style.display !== 'none') {
        status.innerHTML = `
          ⚠️ <span class="error">الكاميرا لم تعمل</span><br><br>
          <small>تأكد من:</small><br>
          ✓ السماح بالوصول للكاميرا<br>
          ✓ الصفحة على HTTPS<br>
          ✓ الكاميرا غير مستخدمة بتطبيق آخر
        `;
      }
    }, 8000);

    // ===== التكبير التلقائي حسب المسافة =====
    AFRAME.registerComponent('distance-scale', {
      schema: {
        reference: {default: 1.5},
        min: {default: 0.7},
        max: {default: 2.2},
        smooth: {default: true},
        smoothFactor: {default: 0.08}
      },
      
      init: function() {
        this.currentScale = 1;
        this.targetScale = 1;
        this.marker = document.querySelector('#marker');
      },
      
      tick: function() {
        if (!this.marker || !this.marker.object3D.visible) return;
        
        const camera = this.el.sceneEl.camera;
        if (!camera) return;
        
        const worldPos = new THREE.Vector3();
        this.el.object3D.getWorldPosition(worldPos);
        const distance = camera.position.distanceTo(worldPos);
        
        this.targetScale = distance / this.data.reference;
        this.targetScale = Math.max(this.data.min, Math.min(this.data.max, this.targetScale));
        
        if (this.data.smooth) {
          this.currentScale += (this.targetScale - this.currentScale) * this.data.smoothFactor;
        } else {
          this.currentScale = this.targetScale;
        }
        
        this.el.object3D.scale.set(this.currentScale, this.currentScale, this.currentScale);
      }
    });

    // ===== الحواف المنحنية =====
    AFRAME.registerComponent('rounded-corners', {
      schema: { radius: {default: 0.12} },
      init: function() {
        this.el.addEventListener('materialtextureloaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh || !mesh.material.map) return;

          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const img = mesh.material.map.image;
          
          canvas.width = img.width;
          canvas.height = img.height;
          const r = this.data.radius * Math.min(canvas.width, canvas.height);
          
          ctx.beginPath();
          ctx.moveTo(r, 0);
          ctx.lineTo(canvas.width - r, 0);
          ctx.arcTo(canvas.width, 0, canvas.width, r, r);
          ctx.lineTo(canvas.width, canvas.height - r);
          ctx.arcTo(canvas.width, canvas.height, canvas.width - r, canvas.height, r);
          ctx.lineTo(r, canvas.height);
          ctx.arcTo(0, canvas.height, 0, canvas.height - r, r);
          ctx.lineTo(0, r);
          ctx.arcTo(0, 0, r, 0, r);
          ctx.closePath();
          ctx.clip();
          ctx.drawImage(img, 0, 0);

          const texture = new THREE.CanvasTexture(canvas);
          mesh.material.map = texture;
          mesh.material.transparent = true;
          mesh.material.needsUpdate = true;
        });
      }
    });
  </script>
</body>
</html>
