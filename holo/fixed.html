<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Instant HUD Hologram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.3.2/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin:0; overflow:hidden; font-family:sans-serif }
    #hint { position:absolute; left:10px; top:10px; z-index:5; background:rgba(0,0,0,.45);
            color:#fff; padding:8px 10px; border-radius:6px; font-size:14px }
  </style>
</head>
<body>
  <div id="hint">هولوجرام أمام الكاميرا مباشرة (بدون ماركر). اضبط الأرقام لو حابب تصغير/تكبير.</div>

  <a-scene embedded arjs="trackingMethod: best; debugUIEnabled: false;"
           renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true">

    <a-assets timeout="10000">
      <img id="logoTex" src="logo.png" crossorigin="anonymous" />
    </a-assets>

    <!-- كاميرا -->
    <a-entity camera look-controls="enabled: false">
      <!-- الهولوجرام مثبت أمام الكاميرا -->
      <!-- ابعد/قرّب بتغيير قيمة Z (اجعلها أكثر سالبًا لتبعد) -->
      <a-entity id="hud" position="0 0 -2.2"
                animation__float="property: position; to: 0 0.02 -2.2; dir: alternate; dur: 2200; easing: easeInOutSine; loop: true">

        <!-- توهج خلفي خفيف -->
        <a-plane width="0.60" height="0.85" position="0 0 0" scale="1.05 1.05 1"
                 material="color:#00eaff; opacity:0.12; transparent:true; blending:additive; shader:flat">
          <a-animation attribute="material.opacity" from="0.10" to="0.20" dur="1400" direction="alternate" repeat="indefinite"></a-animation>
        </a-plane>

        <!-- الصورة الأصلية -->
        <a-plane width="0.60" height="0.85" position="0 0.002 0"
                 material="src:#logoTex; shader:flat; transparent:true; alphaTest:0.01">
        </a-plane>

        <!-- خط مسح يناسب الارتفاع الجديد (0.85 => نصفه ~0.425) -->
        <a-plane position="0 -0.42 0.004" width="0.60" height="0.03"
                 material="color:#00eaff; transparent:true; opacity:0.16; blending:additive">
          <a-animation attribute="position" from="0 -0.42 0.004" to="0 0.42 0.004" dur="1800" repeat="indefinite" easing="linear"></a-animation>
          <a-animation attribute="material.opacity" from="0.10" to="0.26" dur="900" direction="alternate" repeat="indefinite"></a-animation>
        </a-plane>
      </a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
