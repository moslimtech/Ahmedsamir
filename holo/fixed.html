<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>AR بدون ماركر</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,.7);
      color: #fff;
      z-index: 9999;
      pointer-events: auto;
      text-align: center;
    }

    #startBtn {
      margin-top: 12px;
      padding: 12px 22px;
      font-size: 17px;
      background: #00bcd4;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      pointer-events: auto;
    }

    a-scene {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <!-- غطاء البداية -->
  <div id="overlay">
    <div>اضغط لتفعيل الواقع المعزّز باستخدام الموبايل فقط 📱</div>
    <button id="startBtn">ابدأ AR</button>
  </div>

  <!-- مشهد الواقع المعزز -->
  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="alpha:true;colorManagement:true;physicallyCorrectLights:true"
    webxr="optionalFeatures: hit-test, dom-overlay; overlayElement:#overlay"
    markerless-ar>

    <a-assets timeout="10000">
      <!-- الصورة والهالة -->
      <img id="img" src="logo.png" crossorigin="anonymous">
      <img id="shadow" src="shadow.svg" crossorigin="anonymous">
    </a-assets>

    <!-- المؤشر الزرق -->
    <a-ring id="reticle"
            visible="false"
            radius-inner="0.03"
            radius-outer="0.05"
            material="color:#00eaff;opacity:0.9;transparent:true;blending:additive"
            rotation="-90 0 0">
    </a-ring>

    <!-- النموذج -->
    <a-entity id="model" visible="false">
      <a-plane src="#shadow"
               rotation="-90 0 0"
               width="0.5" height="0.3"
               material="transparent:true;blending:multiply;opacity:0.9">
      </a-plane>

      <a-plane src="#img"
               width="0.35" height="0.5"
               position="0 0.25 0"
               material="transparent:true;shader:flat">
      </a-plane>
    </a-entity>

    <a-camera></a-camera>
  </a-scene>

  <script>
    // ===== مكوّن تتبّع السطح =====
    AFRAME.registerComponent('markerless-ar', {
      init: function () {
        const scene = this.el;
        const reticle = document.getElementById('reticle');
        const model = document.getElementById('model');

        let hitSrc = null, viewer = null, ref = null;

        scene.addEventListener('enter-vr', async () => {
          const session = scene.renderer.xr.getSession();

          try {
            ref = scene.renderer.xr.getReferenceSpace();
            viewer = await session.requestReferenceSpace('viewer');
            hitSrc = await session.requestHitTestSource({ space: viewer });

            document.getElementById('overlay').style.display = 'none';

            // عند الضغط على الشاشة، ضع النموذج في موضع المؤشر
            scene.canvas.addEventListener('click', () => {
              if (!reticle.getAttribute('visible')) return;

              model.object3D.position.copy(reticle.object3D.position);
              model.object3D.quaternion.copy(reticle.object3D.quaternion);
              model.setAttribute('visible', true);
            });

            session.addEventListener('end', () => {
              hitSrc = null;
              reticle.setAttribute('visible', false);
              document.getElementById('overlay').style.display = 'flex';
            });

          } catch (e) {
            document.getElementById('overlay').innerText =
              '⚠️ جهازك أو المتصفح لا يدعم WebXR Hit‑Test.';
            console.error(e);
          }

          // التحديث في كل فريم
          scene.addEventListener('tick', () => {
            const f = scene.frame;
            if (!f || !hitSrc || !ref) return;

            const hits = f.getHitTestResults(hitSrc);
            if (hits.length) {
              const pose = hits[0].getPose(ref);
              const o = reticle.object3D;
              o.position.set(
                pose.transform.position.x,
                pose.transform.position.y,
                pose.transform.position.z
              );
              o.quaternion.set(
                pose.transform.orientation.x,
                pose.transform.orientation.y,
                pose.transform.orientation.z,
                pose.transform.orientation.w
              );
              reticle.setAttribute('visible', true);
            } else {
              reticle.setAttribute('visible', false);
            }
          });
        });
      }
    });

    // ===== الزر =====
    document.getElementById('startBtn').addEventListener('click', async () => {
      const scene = document.querySelector('a-scene');
      try {
        if (navigator.xr && await navigator.xr.isSessionSupported('immersive-ar')) {
          scene.enterVR();
        } else {
          document.getElementById('overlay').innerText ="لا يدعم";
 
  
        }
      } catch (e) {
        document.getElementById('overlay').innerText = 'حدث خطأ أثناء بدء AR.';
        console.error(e);
      }
    });
  </script>
</body>
</html>
