<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR بصورة منحنية ثلاثية الأبعاد</title>

  <!-- مكتبات A‑Frame وAR.js -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/3.3.2/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin:0; overflow:hidden; text-align:center; }
    #hint {
      position:fixed; bottom:10px; width:100%;
      color:white; font-size:1.1em; text-shadow:0 0 5px black;
    }
  </style>
</head>

<body>
  <div id="hint">وجّه الكاميرا نحو الماركر (HIRO)</div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <!-- إضاءة بسيطة + إضاءة ناعمة -->
    <a-light type="directional" position="0 1 1" intensity="0.8"></a-light>
    <a-light type="ambient" color="#666"></a-light>

    <!-- الماركر -->
    <a-marker preset="hiro">
      <!-- ظل خفيف أسفل الصورة -->
      <a-plane rotation="-90 0 0" width="1" height="1"
               material="color:#000;opacity:0.3;transparent:true"
               position="0 0 0"></a-plane>

      <!-- اللوحة المنحنية -->
      <a-entity rotation="0 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
        <a-curvedimage 
          src="logo.jpg"
          radius="1.5"
          theta-length="60"
          height="1"
          position="0 0.6 0"
          material="shader: flat; side: double;"
          geometry="radius:1.5;thetaLength:60;height:1;"
          scale="1 1 1"
        ></a-curvedimage>

        <!-- حواف منحنية وزجاجية -->
        <a-cylinder radius="0.51" height="1" theta-length="60"
                    material="color:#fff; opacity:0.15; transparent:true"
                    position="0 0.6 0">
        </a-cylinder>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
