<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AR ذكي - نسخة مستقرة</title>
  
  <!-- استخدام إصدار مستقر من A-Frame و AR.js -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui; }
    
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      padding: 20px;
      text-align: center;
    }
    
    #status {
      font-size: 16px;
      margin: 20px 0;
      max-width: 90%;
    }
    
    .spinner {
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .success { color: #4caf50; font-weight: bold; }
    .error { color: #ff5252; }
    
    #instructions {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-align: center;
      z-index: 9999;
      font-size: 13px;
      display: none;
    }
  </style>
</head>

<body>
  <div id="overlay">
    <div class="spinner"></div>
    <div id="status">جاري تحميل AR.js...</div>
  </div>
  
  <div id="instructions">
    📸 وجّه الكاميرا على ماركر Hiro
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; colorManagement: true; sortObjects: true;">

    <a-assets>
      <!-- استخدام صورة placeholder جاهزة (غيّرها لصورتك) -->
      <img 
        id="logo" 
        src="https://via.placeholder.com/400x600/4CAF50/FFFFFF?text=Your+Logo+Here" 
        crossorigin="anonymous"
        onerror="this.src='https://via.placeholder.com/400x600/2196F3/FFFFFF?text=Image+Not+Found'">
    </a-assets>

    <!-- إضاءة -->
    <a-light type="ambient" intensity="1"></a-light>

    <!-- الماركر -->
    <a-marker preset="hiro" id="marker">
      
      <!-- الظل -->
      <a-plane 
        position="0 0.01 0" 
        rotation="-90 0 0" 
        width="1.8" 
        height="1.8" 
        material="color: #111; opacity: 0.6; transparent: true; shader: flat">
      </a-plane>

      <!-- الصورة الرأسية مع التكيف التلقائي -->
      <a-entity 
        id="content"
        position="0 0.9 0"
        distance-scale="reference: 1.8; min: 0.8; max: 2.5; smooth: true"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
        
        <!-- خلفية بيضاء -->
        <a-plane 
          position="0 0 -0.02"
          width="1" 
          height="1.4" 
          material="color: #ffffff; opacity: 0.95"
          rounded-corners>
        </a-plane>

        <!-- الصورة -->
        <a-plane 
          width="0.9" 
          height="1.3" 
          position="0 0 0.01"
          src="#logo"
          material="transparent: true; alphaTest: 0.2"
          rounded-corners>
        </a-plane>

      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const overlay = document.getElementById('overlay');
    const status = document.getElementById('status');
    const instructions = document.getElementById('instructions');
    
    // ===== معالجة أخطاء تحميل الصورة =====
    window.addEventListener('error', (e) => {
      if (e.target.tagName === 'IMG') {
        console.warn('⚠️ Image failed to load, using placeholder');
      }
    }, true);
    
    // ===== التحقق من HTTPS =====
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      status.innerHTML = '⚠️ <span class="error">يجب فتح الصفحة عبر HTTPS</span>';
      overlay.style.background = 'rgba(200,0,0,0.95)';
    }
    
    window.addEventListener('load', () => {
      status.innerHTML = '📷 جاري طلب إذن الكاميرا...';
    });
    
    const scene = document.querySelector('a-scene');
    
    scene.addEventListener('loaded', () => {
      console.log('✅ A-Frame loaded');
    });
    
    // ===== انتظار تحميل الكاميرا =====
    let cameraLoaded = false;
    
    scene.addEventListener('camera-init', () => {
      console.log('✅ Camera initialized');
      cameraLoaded = true;
      status.innerHTML = '✅ <span class="success">الكاميرا تعمل!</span>';
      setTimeout(() => {
        overlay.style.display = 'none';
        instructions.style.display = 'block';
      }, 1500);
    });
    
    // Fallback: إذا لم يُطلق حدث camera-init
    setTimeout(() => {
      if (!cameraLoaded && document.querySelector('video')) {
        console.log('✅ Camera detected via video element');
        cameraLoaded = true;
        status.innerHTML = '✅ <span class="success">الكاميرا تعمل!</span>';
        setTimeout(() => {
          overlay.style.display = 'none';
          instructions.style.display = 'block';
        }, 1500);
      }
    }, 3000);
    
    // معالجة حالة الفشل
    setTimeout(() => {
      if (overlay.style.display !== 'none') {
        status.innerHTML = `
          ⚠️ <span class="error">الكاميرا لم تعمل</span><br><br>
          <small>تأكد من:</small><br>
          ✓ السماح بالوصول للكاميرا<br>
          ✓ الصفحة على HTTPS<br>
          ✓ المتصفح محدّث (Chrome مُفضّل)
        `;
      }
    }, 10000);

    // ===== التكبير التلقائي حسب المسافة =====
    AFRAME.registerComponent('distance-scale', {
      schema: {
        reference: {default: 1.8},
        min: {default: 0.8},
        max: {default: 2.5},
        smooth: {default: true},
        smoothFactor: {default: 0.08}
      },
      
      init: function() {
        this.currentScale = 1;
        this.targetScale = 1;
        this.marker = document.querySelector('#marker');
      },
      
      tick: function() {
        if (!this.marker || !this.marker.object3D.visible) return;
        
        const camera = this.el.sceneEl.camera;
        if (!camera) return;
        
        const worldPos = new THREE.Vector3();
        this.el.object3D.getWorldPosition(worldPos);
        const distance = camera.position.distanceTo(worldPos);
        
        this.targetScale = distance / this.data.reference;
        this.targetScale = Math.max(this.data.min, Math.min(this.data.max, this.targetScale));
        
        if (this.data.smooth) {
          this.currentScale += (this.targetScale - this.currentScale) * this.data.smoothFactor;
        } else {
          this.currentScale = this.targetScale;
        }
        
        this.el.object3D.scale.set(this.currentScale, this.currentScale, this.currentScale);
      }
    });

    // ===== الحواف المنحنية =====
    AFRAME.registerComponent('rounded-corners', {
      schema: { radius: {default: 0.12} },
      init: function() {
        const applyRounding = () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh || !mesh.material || !mesh.material.map) {
            return;
          }

          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const img = mesh.material.map.image;
          
          if (!img || !img.complete) return;
          
          canvas.width = img.width;
          canvas.height = img.height;
          const r = this.data.radius * Math.min(canvas.width, canvas.height);
          
          ctx.beginPath();
          ctx.moveTo(r, 0);
          ctx.lineTo(canvas.width - r, 0);
          ctx.arcTo(canvas.width, 0, canvas.width, r, r);
          ctx.lineTo(canvas.width, canvas.height - r);
          ctx.arcTo(canvas.width, canvas.height, canvas.width - r, canvas.height, r);
          ctx.lineTo(r, canvas.height);
          ctx.arcTo(0, canvas.height, 0, canvas.height - r, r);
          ctx.lineTo(0, r);
          ctx.arcTo(0, 0, r, 0, r);
          ctx.closePath();
          ctx.clip();
          ctx.drawImage(img, 0, 0);

          const texture = new THREE.CanvasTexture(canvas);
          mesh.material.map = texture;
          mesh.material.transparent = true;
          mesh.material.needsUpdate = true;
        };
        
        this.el.addEventListener('materialtextureloaded', applyRounding);
        
        // Fallback
        setTimeout(applyRounding, 1000);
      }
    });
  </script>
</body>
</html>
