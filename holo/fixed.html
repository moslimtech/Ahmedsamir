<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AR Vertical Hologram with Shadow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>
    /* ... (نفس الأنماط السابقة) ... */
    body { margin: 0; overflow: hidden; }
    #info-box { position: absolute; left: 10px; top: 10px; z-index: 5; background: rgba(0,0,0,0.5); color: white; padding: 10px; border-radius: 8px; font-family: sans-serif; font-size: 14px; }
  </style>
</head>
<body>
  <div id="info-box">
    <span>حرك هاتفك ببطء للتعرف على السطح، ثم اضغط على الدائرة.</span>
  </div>

  <a-scene
    webxr="optionalFeatures: hit-test, dom-overlay; overlayElement: #info-box;"
    ar-hit-test="target: #reticle; type: an"
    renderer="colorManagement: true;"
    shadow="type: pcfsoft"
    cursor="rayOrigin: mouse; fuse: false">

    <a-assets timeout="10000">
      <img id="logoTex" src="logo.png" crossorigin="anonymous" />
    </a-assets>

    <!-- إضاءة الشمس لإنتاج الظل -->
    <a-light type="directional" position="1 4 2" intensity="1.5"
             shadow-camera-top="2" shadow-camera-bottom="-2"
             shadow-camera-left="-2" shadow-camera-right="2"
             castShadow="true"></a-light>
    <!-- إضاءة محيطية خفيفة لتنعيم المشهد -->
    <a-light type="ambient" intensity="0.6"></a-light>

    <a-camera position="0 1.2 0"></a-camera>

    <!-- مؤشر تحديد المكان -->
    <a-entity id="reticle" scale="0.8 0.8 0.8" ar-hit-test-reticle>
      <a-ring radius-inner="0.1" radius-outer="0.15" color="#00eaff"></a-ring>
    </a-entity>

    <!-- حاوية الهولوجرامات التي ستظهر -->
    <a-entity id="hologram-container"></a-entity>

    <!-- أرضية شفافة لاستقبال الظل -->
    <a-plane id="ground" position="0 0 0" rotation="-90 0 0" width="30" height="30"
             ar-shadow-plane
             material="shader: shadow; transparent: true; opacity: 0.35;">
    </a-plane>

  </a-scene>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const sceneEl = document.querySelector('a-scene');
      const hologramContainer = document.getElementById('hologram-container');
      
      sceneEl.addEventListener('ar-hit-test-select', (event) => {
        const tapPosition = event.detail.position;

        // إنشاء الهولوجرام العمودي
        const hologram = document.createElement('a-entity');
        hologram.setAttribute('position', tapPosition);
        
        // --- 1. جعله عموديًا ---
        hologram.setAttribute('rotation', '-90 0 0');

        // --- 2. تفعيل الظل ---
        hologram.setAttribute('shadow', 'cast: true');
        
        // طبقات الهولوجرام (كما في المثال السابق ولكن مع الظل)
        hologram.innerHTML = `
          <!-- طبقة التوهج -->
          <a-plane width="0.6" height="0.85" position="0 0 0" scale="1.05 1.05 1" material="color:#00eaff; opacity:0.12; transparent:true; blending:additive; shader:flat"></a-plane>
          
          <!-- الصورة الأصلية -->
          <a-plane width="0.6" height="0.85" position="0 0.002 0" material="src:#logoTex; shader:flat; transparent:true; alphaTest:0.01"></a-plane>
          
          <!-- خط المسح -->
          <a-plane position="0 -0.42 0.004" width="0.6" height="0.03" material="color:#00eaff; transparent:true; opacity:0.16; blending:additive">
            <a-animation attribute="position" from="0 -0.42 0.004" to="0 0.42 0.004" dur="1800" repeat="indefinite" easing="linear"></a-animation>
          </a-plane>
        `;
        
        hologramContainer.appendChild(hologram);
      });
    });
  </script>

</body>
</html>
