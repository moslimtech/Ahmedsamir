<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Hologram Logo AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.3.2/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin:0; overflow:hidden; }
    #hint { 
      position:absolute; left:10px; top:10px; z-index:5; 
      background:rgba(0,0,0,0.45); color:white; padding:8px 10px; 
      border-radius:6px; font-size:14px; 
    }
  </style>
</head>
<body>
  <div id="hint">وجّه الكاميرا على ماركر Hiro لعرض الشعار.</div>

  <!-- Canvas مخفي لرسم الصورة بزوايا دائرية -->
  <canvas id="roundedCanvas" width="256" height="384" style="display:none"></canvas>

  <a-scene embedded arjs="debugUIEnabled: false;">
    <a-assets>
      <!-- نستخدم الكانفَس كمصدر -->
      <img id="logoTex" src="" crossorigin="anonymous" />
    </a-assets>

    <a-marker preset="hiro">
      <a-entity position="0 0 0">
        <!-- صورة portrait مع زوايا دائرية -->
        <a-plane 
          position="0 0.75 0" 
          rotation="-90 0 0" 
          width="1.1" 
          height="1.6"
          material="src: #roundedCanvas; shader: flat; transparent: true; alphaTest: 0.01"
        ></a-plane>

        <!-- Scanline -->
        <a-plane 
          position="0 -0.8 0.001" 
          width="1.1" 
          height="0.03"
          material="color: #00eaff; transparent: true; opacity: 0.12; blending: additive"
        >
          <a-animation 
            attribute="position" 
            from="0 -0.8 0.001" 
            to="0 0.8 0.001" 
            dur="2400" 
            repeat="indefinite" 
            easing="linear"
          ></a-animation>
        </a-plane>

        <!-- الهالة -->
        <a-ring 
          position="0 0.01 0" 
          rotation="-90 0 0" 
          radius-inner="0.25" 
          radius-outer="0.55"
          material="color: #00eaff; opacity: 0.15; transparent: true; blending: additive"
        >
          <a-animation 
            attribute="material.opacity" 
            from="0.10" 
            to="0.22" 
            dur="1600" 
            direction="alternate" 
            repeat="indefinite"
          ></a-animation>
        </a-ring>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // رسم الصورة بزوايا دائرية داخل الكانفَس
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = 'logo.png'; // نفس المسار القديم
    img.onload = () => {
      const canvas = document.getElementById('roundedCanvas');
      const ctx = canvas.getContext('2d');
      const r = 24; // نصف قطر الزاوية
      const w = canvas.width;
      const h = canvas.height;

      ctx.clearRect(0, 0, w, h);

      // قص مسار دائري للزوايا
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(w - r, 0);
      ctx.quadraticCurveTo(w, 0, w, r);
      ctx.lineTo(w, h - r);
      ctx.quadraticCurveTo(w, h, w - r, h);
      ctx.lineTo(r, h);
      ctx.quadraticCurveTo(0, h, 0, h - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.clip();

      ctx.drawImage(img, 0, 0, w, h);

      // حدّد الكانفَس كمصدر للـ <img>
      document.getElementById('logoTex').src = canvas.toDataURL();
    };
  </script>
</body>
</html>
