<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hologram Logo AR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.3.2/aframe/build/aframe-ar.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #hint { position: absolute; left: 10px; top: 10px; z-index: 5; background: rgba(0,0,0,0.45); color: white; padding: 8px 10px; border-radius: 6px; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="hint">وجه الكاميرا إلى ماركر Hiro.</div>
    <a-scene embedded arjs="debugUIEnabled: false;">
      <a-assets>
        <img id="logoTex" src="logo.png" crossorigin="anonymous" />
      </a-assets>

      <a-marker preset="hiro">
        <!-- اللوحة الهولوجرامية -->
        <a-plane 
          position="0 0.75 0" 
          rotation="-90 0 0"
          width="1.1" 
          height="1.6" 
          material="src: #logoTex; transparent: true; opacity: 0.80; emissive: #00eaff; emissiveIntensity: 1.6; metalness: 0.7; roughness: 0.1"
          animation="property: rotation; to: -90 360 0; loop: true; dur: 8000"
        ></a-plane>
        <!-- هالة ضوئية ديناميكية -->
        <a-ring 
          position="0 0.01 0" 
          rotation="-90 0 0" 
          radius-inner="0.20" 
          radius-outer="0.6"
          material="color: #00eaff; opacity: 0.18"
          animation="property: material.opacity; to: 0.30; dir: alternate; dur: 1600; loop: true"
        ></a-ring>
        <!-- إضاءة متعددة -->
        <a-entity light="type: point; intensity: 1; decay: 2; color: #00eaff" position="0 2 1"></a-entity>
        <a-entity light="type: ambient; intensity: 0.7"></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
