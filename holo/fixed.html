<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <title>Markerless AR — Vertical Poster + Soft Shadow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    body { margin:0; overflow:hidden; font-family:system-ui, sans-serif }

    /* ✅ الـ overlay فوق كل شيء وقابل للضغط */
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.7);
      color: #fff;
      flex-direction: column;
      gap: 12px;
      z-index: 9999;              /* أعلى قيمة */
      pointer-events: auto;       /* ضروري للتفاعل */
    }

    #startBtn {
      padding: 12px 20px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      background: #00bcd4;
      color: #fff;
      cursor: pointer;
      pointer-events: auto;       /* تأكيد إضافي */
    }

    #startBtn:active {
      background: #0097a7;
      transform: scale(0.97);
    }

    #msg {
      font-size: 15px;
      opacity: 0.9;
      text-align: center;
      max-width: 90%;
      line-height: 1.5;
    }

    /* ✅ الـ A‑Frame canvas خلف overlay */
    a-scene {
      z-index: 1;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; /* يخلي النقر يمرّ للزر */
    }
  </style>
</head>

<body>
  <!-- ✅ overlay أول حاجة -->
  <div id="overlay">
    <div id="msg">اضغط لبدء الواقع المعزّز وتتبع الأسطح بدون ماركر</div>
    <button id="startBtn">ابدأ AR</button>
  </div>

  <!-- ✅ الـ scene تكون تحت overlay -->
  <a-scene
    embedded
    renderer="alpha:true; colorManagement:true; physicallyCorrectLights:true"
    vr-mode-ui="enabled:false"
    webxr="optionalFeatures: hit-test, dom-overlay; overlayElement: #overlay"
    ar-hit-test
  >
    <a-assets><img id="logoTex" src="logo.png"></a-assets>
    <a-camera></a-camera>
  </a-scene>

  <script>
    /* مجرّد مثال بسيط لاختبار الزر */
    document.getElementById("startBtn").addEventListener("click", () => {
      console.log("الزر اشتغل 🎯");
      const scene = document.querySelector("a-scene");
      scene.enterVR(); // يبدأ جلسة AR
      document.getElementById("overlay").style.display = "none";
    });
  </script>
</body>
</html>
